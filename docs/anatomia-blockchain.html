<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cadena de bloques · anatomía</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(900px,100% - 32px);margin:64px auto 96px}

</div><pre class="bc-inspect" data-inspect aria-live="off"></pre><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>El bloque elegido y el cabezal lector (is_valid_chain)</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Llave = hash · cerradura = previous_hash</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Algo no cuadra</span></span><span class="iso-caption">Cada caja es un bloque de data/blocks.json. Su hash es la llave y los tres primeros dientes a ras son el 000 de la prueba de trabajo. La cerradura de la caja siguiente guarda el previous_hash: si no encajan, el acoplamiento se abre. El cabezal lector hace lo mismo que is_valid_chain: salta el génesis y se detiene en el primer error.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";

const K = new Uint32Array([

]);
const W = new Uint32Array(64);

function sha256hex(text) {
  const bytes = new Uint8Array(text.length); // solo ASCII en este proyecto
  for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 0xff;
  const bits = bytes.length * 8;
  const padded = new Uint8Array(((bytes.length + 9 + 63) >> 6) << 6);
  padded.set(bytes);
  padded[bytes.length] = 0x80;
  const view = new DataView(padded.buffer);
  view.setUint32(padded.length - 8, Math.floor(bits / 4294967296));
  view.setUint32(padded.length - 4, bits >>> 0);
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a, h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  for (let off = 0; off < padded.length; off += 64) {
    for (let i = 0; i < 16; i++) W[i] = view.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = W[i - 15], b = W[i - 2];
      const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
      const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + W[i]) | 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
  }
  return [h0, h1, h2, h3, h4, h5, h6, h7].map((v) => (v >>> 0).toString(16).padStart(8, "0")).join("");
}

// json.dumps(..., sort_keys=True) de Python: separadores ", " y ": ", floats como 50.0.
// Un float se marca con {f: 50}; un int es un number normal.
const pyFloat = (n) => (Number.isInteger(n) ? n.toFixed(1) : String(n));
function pyDumps(value) {
  if (value === null) return "null";
  if (typeof value === "string") return JSON.stringify(value);
  if (typeof value === "number") return String(value);
  if (Array.isArray(value)) return "[" + value.map(pyDumps).join(", ") + "]";
  if (Object.keys(value).length === 1 && "f" in value) return pyFloat(value.f);
  return "{" + Object.keys(value).sort().map((key) => JSON.stringify(key) + ": " + pyDumps(value[key])).join(", ") + "}";
}

// Block.calculate_hash
function blockString(block, nonce) {
  return pyDumps({ index: block.index, timestamp: block.timestamp, transactions: block.transactions, previous_hash: block.previous_hash, nonce });
}
const hashBlock = (block, nonce = block.nonce) => sha256hex(blockString(block, nonce));

// Block.proof_of_work: nonce = 0, 1, 2... hasta que el hash empieza por "0" * dificultad.
// Devuelve ademas el rastro de los TRAIL primeros digitos de cada intento, para dibujar la llave girando.
const TRAIL = 10;
function mine(block, difficulty = 3) {
  const prefix = "0".repeat(difficulty);
  const probe = blockString(block, 2147483647);
  const at = probe.indexOf("2147483647");
  const head = probe.slice(0, at), tail = probe.slice(at + 10);
  const trail = [];
  for (let nonce = 0; ; nonce++) {
    const hash = sha256hex(head + nonce + tail);
    for (let i = 0; i < TRAIL; i++) trail.push(parseInt(hash[i], 16));
    if (hash.startsWith(prefix)) return { nonce, hash, attempts: nonce + 1, trail: Uint8Array.from(trail) };
  }
}

// Blockchain.is_valid_chain, con los mismos mensajes. Empieza en i = 1: el genesis no se comprueba.
function validate(chain, difficulty = 3) {
  const prefix = "0".repeat(difficulty);
  for (let i = 1; i < chain.length; i++) {
    const current = chain[i], previous = chain[i - 1];
    if (current.hash !== hashBlock(current)) return { ok: false, at: i, check: "hash", message: `[Error] Hash incorrecto en el bloque ${i}` };
    if (!current.hash.startsWith(prefix)) return { ok: false, at: i, check: "pow", message: `[Error] Hash no cumple PoW en el bloque ${i}` };
    if (current.previous_hash !== previous.hash) return { ok: false, at: i, check: "link", message: `[Error] Hash anterior no coincide en el bloque ${i}` };
  }
  return { ok: true, at: -1, check: null, message: "" };
}

// Los dientes de la llave: los 6 primeros digitos hex del hash ("0" del genesis = todo a cero).
const nibbles = (hash) => Array.from({ length: 6 }, (_, i) => (hash && hash[i] ? parseInt(hash[i], 16) : 0));

// Python: datetime.now().isoformat()
function pyNow(date = new Date()) {
  const p = (n, w = 2) => String(n).padStart(w, "0");
  return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}:${p(date.getSeconds())}.${p(date.getMilliseconds(), 3)}000`;
}

// Geometria compartida entre build.mjs y la pagina viva: la llave (hash) y la cerradura (previous_hash).
// Todo en coordenadas locales del bloque: x desde el inicio de la balda, y desde el fondo, z hacia arriba.

const C = {
  Z0: 5, // cara superior de la patin
  H: 34, // alto del cuerpo
  SHELF_W: 34, // balda con la cerradura
  BODY_W: 46,
  LB: 80, // paso entre bloques = SHELF_W + BODY_W
  D: 52,
  SHELF_TOP: 35, // Z0 + H - BT
  BT: 4, // grosor de la llave
  BL: 28.4, // largo de la llave
  YS: 6, // y de la espina
  SPINE: 4,
  T0: 1.2, // primer diente
  TW: 3.0, // ancho de diente
  PITCH: 4.6,
  TOOTH: 1.7, // largo de diente por cada unidad de nibble
  GAP: 12, // cuanto se abre un acoplamiento roto
  MARGIN: 0.4, // holgura de la cerradura
};

function makeGeom(k, P) {
  const { SHELF_TOP, BT, BL, YS, SPINE, T0, TW, PITCH, TOOTH, MARGIN, LB } = C;
  const PINS = 6;

  // Contorno (concavo) de una espina con dientes. Un diente de nibble 0 no existe: la espina queda lisa.
  // m > 0 da la cerradura: la misma forma, ensanchada por la holgura, y pegada a la arista izquierda de la balda.
  function comb(nibs, x0, m = 0) {
    const top = YS + SPINE;
    const ring = [
      [x0, YS - m],
      [x0 + BL + m, YS - m],
      [x0 + BL + m, top],
    ];
    for (let i = PINS - 1; i >= 0; i--) {
      const len = nibs[i] * TOOTH;
      if (len < 0.05) continue;
      const left = x0 + T0 + i * PITCH;
      ring.push([left + TW + m, top], [left + TW + m, top + len + m], [left - m, top + len + m], [left - m, top]);
    }
    ring.push([x0, top]);
    return ring;
  }

  const bladeRing = (nibs) => comb(nibs, LB, 0);
  const keywayRing = (nibs) => comb(nibs, 0, MARGIN);

  const bladeSvg = (nibs) => k.solidSvg(k.extrude(bladeRing(nibs), SHELF_TOP, BT, P, { convex: false }), { tone: "hi", crease: "lo" });

  // La cerradura es un vaciado plano en la balda: relleno de papel y contorno.
  function keywaySvg(nibs) {
    const ring = keywayRing(nibs);
    const fill = k.pathOf(ring.map(([x, y]) => k.iso([x, y, SHELF_TOP], P)), true);
    return `<path class="bc-recess" d="${fill}"/>` + k.lineSvg(k.onTop(ring, SHELF_TOP, P, true), { tone: "lo" });
  }

  return { comb, bladeRing, keywayRing, bladeSvg, keywaySvg, PINS };
}

const hexOf = (list) => Array.from(list, (n) => n.toString(16)).join("");
let chain = clone(DATA.chain);

let edited = {}; // "i:j" -> true
let token = 0;
let visible = false;
let idleTimer = 0;
const zeroNibs = () => [0, 0, 0, 0, 0, 0];

const V = {
  off: Array(SLOTS).fill(0),
  offT: Array(SLOTS).fill(0),
  way: Array.from({ length: SLOTS }, zeroNibs),
  wayT: Array.from({ length: SLOTS }, zeroNibs),
  key: Array.from({ length: SLOTS }, zeroNibs),
  hashS: Array(SLOTS).fill(""),
  nonceS: Array(SLOTS).fill("00000"),
  lamps: Array.from({ length: SLOTS }, () => ["idle", "idle", "idle"]),

const slotX = (i) => i * LB + V.off[i];
const slotXT = (i) => i * LB + V.offT[i];

function syncAll() {
  // vuelve a pintar la vista a partir de los datos (tras reset, cancelacion o carga)
  for (let i = 0; i < SLOTS; i++) {
    const b = chain[i];
    V.hashS[i] = b ? b.hash : "";
    V.nonceS[i] = b ? String(b.nonce).padStart(5, "0") : "00000";
    V.key[i] = b ? nibbles(b.hash) : zeroNibs();
    V.wayT[i] = b ? nibbles(b.previous_hash) : nibbles(chain[chain.length - 1].hash);
    V.alphaT[i] = b ? 1 : 0;
  }
  V.hideCard = {};
  V.card.from = null;
  retarget();
  kick();
}
function retarget() {
  let x = 0;
  for (let i = 0; i < SLOTS; i++) {
    if (i > 0 && chain[i] && chain[i].previous_hash !== chain[i - 1].hash) x += GAP;
    V.offT[i] = x;
  }
}
function snapAll() {
  V.off = V.offT.slice();
  V.way = V.wayT.map((n) => n.slice());

// ---------------------------------------------------------------- dibujo: V -> DOM (solo lo que cambia)
const memo = new Map();
const put = (key, value, apply) => {

};
const tr = (x) => translateAlong(P, [x, 0, 0]);
const zerosOf = (hash) => {
  let n = 0;
  while (n < Math.min(10, hash.length) && hash[n] === "0") n++;
  return n;
};
function render() {
  for (let i = 0; i < SLOTS; i++) {
    const B = BLOCK[i];
    const x = tr(slotX(i));
    for (const g of [B.base, B.cards, B.blade]) put(`tr${i}${g.dataset.part || "b"}`, x, (v) => g.setAttribute("transform", v));
    const op = V.alpha[i].toFixed(2);
    if (i === SLOTS - 1) for (const g of [B.base, B.cards, B.blade]) put(`op${i}${g.dataset.part || "b"}`, op, (v) => ((g.style.opacity = v), (g.style.pointerEvents = V.alpha[i] > 0.5 ? "" : "none")));
    const z = zerosOf(V.hashS[i]);
    put(`z${i}`, V.hashS[i].slice(0, z), (v) => (B.zeros.textContent = v));
    put(`r${i}`, V.hashS[i].slice(z, 10) + (V.hashS[i].length > 10 ? "…" : ""), (v) => (B.rest.textContent = v));
    const digits = V.nonceS[i];
    B.digits.forEach((el, n) => {

    B.lamps.forEach((el, n) => put(`l${i}${n}`, V.lamps[i][n], (v) => (el.dataset.state = v)));

// ---------------------------------------------------------------- bucle de muelles
let raf = 0;
let lastT = 0;
function frame(now) {
  raf = 0;
  const dt = lastT ? Math.min((now - lastT) / 1000, 1 / 20) : 1 / 60;
  lastT = now;
  const calm = still.matches;
  let moving = false;
  const follow = (cur, target, tau) => {
    if (calm) return target;
    const next = cur + (target - cur) * (1 - Math.exp(-dt / tau));
    if (Math.abs(target - next) < 0.02) return target;
    moving = true;
    return next;
  };
  for (let i = 0; i < SLOTS; i++) {
    V.off[i] = follow(V.off[i], V.offT[i], 0.3);
    V.alpha[i] = follow(V.alpha[i], V.alphaT[i], 0.22);
    for (let n = 0; n < 6; n++) V.way[i][n] = follow(V.way[i][n], V.wayT[i][n], 0.16);
  }
  V.scanX = follow(V.scanX, V.scanXT, 0.26);
  render();
  if (moving) raf = requestAnimationFrame(frame);
  else lastT = 0;
}
const kick = () => {
  if (!raf) raf = requestAnimationFrame(frame);
};

// ---------------------------------------------------------------- esperas que se pueden cancelar
const sleep = (ms, tk) => new Promise((res, rej) => setTimeout(() => (tk !== token ? rej(CANCELLED) : res()), still.matches ? 0 : ms));
const tween = (ms, step, tk) =>
  new Promise((res, rej) => {
    if (still.matches) {
      step(1);
      return res();
    }
    const t0 = performance.now();
    const go = (now) => {
      if (tk !== token) return rej(CANCELLED);
      const t = Math.min(1, (now - t0) / ms);
      step(t);
      render();
      t < 1 ? requestAnimationFrame(go) : res();
    };
    requestAnimationFrame(go);
  });
const until = (test, tk, max = 1600) =>
  new Promise((res, rej) => {
    const t0 = performance.now();
    const go = () => {
      if (tk !== token) return rej(CANCELLED);
      if (test() || still.matches || performance.now() - t0 > max) return res();
      requestAnimationFrame(go);
    };
    go();
  });
const say = (text) => {
  if (readout.textContent !== text) readout.textContent = text;
};

// ---------------------------------------------------------------- acciones
function select(i) {
  if (i < 0 || i >= chain.length) return;
  V.sel = i;
  labels();
  inspect();
  render();
}

function tamper(i) {
  const list = chain[i].transactions;
  const j = list.length - 1;
  const a = list[j].amount;
  list[j].amount = typeof a === "object" ? { f: a.f + 1 } : a + 1;
  edited[`${i}:${j}`] = true;
  V.sel = i;
  inspect();
  labels();
}

async function remine(i, tk) {
  const b = chain[i];
  V.sel = i;
  labels();
  if (i > 0 && b.previous_hash !== chain[i - 1].hash) {
    say(`bloque ${i}: copiando previous_hash…`);
    b.previous_hash = chain[i - 1].hash; // el falsificador tiene que arreglar el enlace antes de re-minar
    V.wayT[i] = nibbles(b.previous_hash);
    retarget();
    kick();
    await sleep(700, tk);
  }
  const r = mine(b); // trabajo real: SHA-256 hasta encontrar "000…"
  say(`minando bloque ${i}…`);
  await tween(1000 + Math.min(1500, r.attempts / 3), (t) => {
    const idx = Math.min(r.attempts - 1, Math.floor(r.attempts * (1 - Math.pow(1 - t, 3))));
    V.nonceS[i] = String(idx).padStart(5, "0");
    V.hashS[i] = hexOf(r.trail.subarray(idx * TRAIL, idx * TRAIL + TRAIL));
    V.key[i] = Array.from(r.trail.subarray(idx * TRAIL, idx * TRAIL + 6));
    say(`minando bloque ${i} · intento ${idx + 1}`);
  }, tk);
  b.nonce = r.nonce;
  b.hash = r.hash;
  b.attempts = r.attempts;
  V.hashS[i] = b.hash;
  V.nonceS[i] = String(b.nonce).padStart(5, "0");
  V.key[i] = nibbles(b.hash);
  retarget();
  kick();
  say(`bloque ${i} minado en ${r.attempts} intentos`);
  inspect();
  await sleep(450, tk);
}

async function mineNew(tk) {
  if (chain.length >= SLOTS || !pending.length) {
    say("No hay transacciones para minar");
    return;
  }
  const i = chain.length;
  const prev = chain[i - 1];
  const block = { index: i, timestamp: pyNow(), transactions: [{ from: "coinbase", to: "Fonsi", amount: 3, type: "reward" }, ...clone(pending)], previous_hash: prev.hash, nonce: 0, hash: "" };
  V.sel = i;
  V.hashS[i] = "";
  V.nonceS[i] = "00000";
  V.key[i] = zeroNibs();
  V.way[i] = nibbles(prev.hash);
  V.wayT[i] = nibbles(prev.hash);
  V.hideCard[`${i}:1`] = true;
  V.alphaT[i] = 1;
  retarget();
  kick();
  say("sacando la transacción pendiente…");
  await sleep(450, tk);
  const tx = WORLD.TRAY;
  const goal = { dx: i * LB + V.offT[i] + tx.x + 3 + 15 - WORLD.HOPPER.x, dy: tx.y - WORLD.HOPPER.y, dz: tx.z - WORLD.HOPPER.z };
  await tween(900, (t) => {
    const e = t * t * (3 - 2 * t);
    V.card.from = { dx: goal.dx * e, dy: goal.dy * e, dz: goal.dz * e + Math.sin(Math.PI * t) * 16 };
  }, tk);
  V.card.from = null;
  V.hideCard[`${i}:1`] = false;
  const r = mine(block);
  say("minando bloque nuevo…");
  await tween(1000 + Math.min(1500, r.attempts / 3), (t) => {
    const idx = Math.min(r.attempts - 1, Math.floor(r.attempts * (1 - Math.pow(1 - t, 3))));
    V.nonceS[i] = String(idx).padStart(5, "0");
    V.hashS[i] = hexOf(r.trail.subarray(idx * TRAIL, idx * TRAIL + TRAIL));
    V.key[i] = Array.from(r.trail.subarray(idx * TRAIL, idx * TRAIL + 6));
    say(`minando bloque ${i} · intento ${idx + 1}`);
  }, tk);
  block.nonce = r.nonce;
  block.hash = r.hash;
  block.attempts = r.attempts;
  chain.push(block);
  pending = []; // app.py: TransactionManager.save_transactions([])
  V.hashS[i] = block.hash;
  V.nonceS[i] = String(block.nonce).padStart(5, "0");
  V.key[i] = nibbles(block.hash);
  say(`bloque ${i} minado · Fonsi recibe 3`);
  inspect();
  labels();
  await sleep(450, tk);
}

// is_valid_chain(): el cabezal visita cada bloque desde el 1 y se detiene en el primer error
async function scan(tk) {
  for (const row of V.lamps) row[0] = row[1] = row[2] = "idle";
  V.head = ["idle", "idle", "idle"];
  V.scanText = "";
  render();
  const checks = [
    (cur) => hashBlock(cur) === cur.hash,
    (cur) => cur.hash.startsWith("000"),
    (cur, prev) => cur.previous_hash === prev.hash,
  ];
  const verdict = validate(chain);
  for (let i = 1; i < chain.length; i++) {
    say(`comprobando bloque ${i}…`);
    V.scanXT = slotXT(i) + WORLD.HEAD_X;
    kick();
    await until(() => Math.abs(V.scanX - V.scanXT) < 0.6, tk);
    V.scanText = hashBlock(chain[i]).slice(0, 6);
    for (let n = 0; n < 3; n++) {
      V.lamps[i][n] = V.head[n] = "run";
      render();
      await sleep(240, tk);
      const ok = checks[n](chain[i], chain[i - 1]);
      V.lamps[i][n] = V.head[n] = ok ? "ok" : "bad";
      render();
      if (!ok) {
        say(verdict.message);
        inspect();
        await sleep(300, tk);
        return verdict;
      }
    }
    await sleep(160, tk);
    V.head = ["idle", "idle", "idle"];
  }
  say("is_valid_chain() → True");
  inspect();
  return verdict;
}

function reset() {
  chain = clone(DATA.chain);
  pending = clone(DATA.pending);
  edited = {};
  V.sel = 1;
  for (const row of V.lamps) row[0] = row[1] = row[2] = "idle";
  V.head = ["idle", "idle", "idle"];
  V.scanText = "";
  V.scanXT = WORLD.HEAD_X;
  syncAll();
  snapAll();
  render();
  labels();
  inspect();
  say("is_valid_chain() → True");
}

// ---------------------------------------------------------------- inspector, botones y entrada
const html = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const hashHtml = (h) => {
  const z = zerosOf(h);
  return `<span class="zz">${h.slice(0, z)}</span>${h.slice(z)}`;
};
function inspect() {
  const i = V.sel;
  const b = chain[i];
  if (!b) {
    inspectEl.innerHTML = '<span class="dim">Aún no hay bloque 3: pulsa «Minar bloque nuevo».</span>';
    return;
  }
  const computed = hashBlock(b);
  const prev = chain[i - 1];
  const txs = b.transactions
    .map((t, j) => {
      const who = t.type ? `${t.from} → ${t.to}  <b>${amountText(t.amount)}</b>  (${t.type})` : `${t.sender} → ${t.receiver}  <b>${amountText(t.amount)}</b>`;
      return `${j + 1}) ${who}${edited[`${i}:${j}`] ? '  <span class="bad">← alterada</span>' : ""}`;
    })
    .join("\n               ");
  const link = i === 0 ? '<span class="dim">génesis (sin bloque anterior)</span>' : b.previous_hash === prev.hash ? '<span class="ok">✓ es el hash del bloque ' + (i - 1) + "</span>" : '<span class="bad">✗ ya no es el hash del bloque ' + (i - 1) + "</span>";
  const same = computed === b.hash;
  inspectEl.innerHTML = [
    `<b>Bloque ${i}</b>${i === 0 ? '  <span class="dim">is_valid_chain no comprueba este bloque (el bucle empieza en 1)</span>' : ""}`,
    `timestamp      ${html(b.timestamp)}`,
    `previous_hash  ${i === 0 ? "0" : hashHtml(b.previous_hash)}  ${link}`,
    `transacciones  ${txs}`,
    `nonce          <b>${b.nonce}</b>  <span class="dim">${b.attempts ? b.attempts + " intentos" : "se probó nonce 0, 1, 2… hasta dar con él"}</span>`,
    `hash guardado  ${hashHtml(b.hash)}`,
    `sha256 ahora   ${hashHtml(computed)}  ${same ? '<span class="ok">✓ coincide</span>' : '<span class="bad">✗ distinto</span>'}`,
  ].join("\n");
}
function labels() {
  btn.tamper.textContent = `Alterar bloque ${V.sel} (+1)`;
  btn.remine.textContent = `Re-minar bloque ${V.sel}`;
  btn.new.disabled = chain.length >= SLOTS || !pending.length;
}

function userActed() {
  token++;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startTour, 30000);
}
const act = (fn) => {
  userActed();
  const tk = token;
  syncAll(); // deja la vista como dicen los datos: una accion cancelada a medias no deja restos
  return (async () => {
    try {
      await fn(tk);
    } catch (error) {
      if (error !== CANCELLED) throw error;
    }
  })();
};
const doTamper = () => act(async (tk) => (tamper(V.sel), render(), await sleep(350, tk), await scan(tk)));
const doRemine = () => act(async (tk) => (await remine(V.sel, tk), await scan(tk)));
const doNew = () => act(async (tk) => (await mineNew(tk), await scan(tk)));
const doScan = () => act(async (tk) => await scan(tk));
const doReset = () => act(async () => reset());

btn.tamper.addEventListener("click", doTamper);
btn.remine.addEventListener("click", doRemine);
btn.new.addEventListener("click", doNew);
btn.scan.addEventListener("click", doScan);
btn.reset.addEventListener("click", doReset);
svg.addEventListener("click", (event) => {
  if (event.target.closest("[data-act]")) return doNew();
  const hit = event.target.closest("[data-block]");
  if (hit) {
    userActed();
    select(+hit.dataset.block);
  }
});
stage.addEventListener("keydown", (event) => {
  const key = event.key.toLowerCase();
  if (key === "arrowright") (event.preventDefault(), userActed(), select(Math.min(chain.length - 1, V.sel + 1)));
  else if (key === "arrowleft") (event.preventDefault(), userActed(), select(Math.max(0, V.sel - 1)));
  else if (key === "t") doTamper();
  else if (key === "m") doRemine();
  else if (key === "n") doNew();
  else if (key === "s") doScan();
  else if (key === "r") doReset();
});

// ---------------------------------------------------------------- demostracion automatica
async function tour(tk) {
  const wait = async (ms) => {
    await sleep(ms, tk);
    await until(() => visible, tk, 1e9);
  };
  for (;;) {
    reset();
    await wait(1200);
    await scan(tk); // todo en orden
    await wait(1400);
    tamper(1);
    render();
    await wait(900);
    await scan(tk); // Hash incorrecto en el bloque 1
    await wait(1800);
    await remine(1, tk); // lo re-mina...
    await scan(tk); // ...pero el bloque 2 ya no encaja
    await wait(1800);
    await remine(2, tk);
    await scan(tk); // y hay que re-minar todos los siguientes
    await wait(3200);
  }
}
async function startTour() {
  if (still.matches) return;
  token++;
  const tk = token;
  try {
    await tour(tk);
  } catch (error) {
    if (error !== CANCELLED) throw error;
  }
}
new IntersectionObserver((entries) => (visible = entries[entries.length - 1].isIntersecting), { rootMargin: "120px 0px" }).observe(stage);

// ---------------------------------------------------------------- arranque
reset();
if (!still.matches) {
  visible = true;
  startTour();
}
window.__bc = {
  get chain() { return chain; },
  get busy() { return false; },
  stop: () => userActed(),
  select, tamper: doTamper, remine: doRemine, mineNew: doNew, scan: doScan, reset: doReset,
  get readout() { return readout.textContent; },
  state: () => ({ off: V.off.slice(), sel: V.sel, lamps: V.lamps.map((r) => r.slice()), len: chain.length }),
};
